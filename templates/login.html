<!doctype html>
<html lang="en">

<!-- 元数据 -->
<head>

	<!-- Required meta tags -->
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">

	<!--favicon-->
	<link rel="icon" href="/static/assets/images/logo-icon-daa.png" type="image/png" />

	<!--plugins-->
	<link href="/static/assets/plugins/simplebar/css/simplebar.css" rel="stylesheet" />
	<link href="/static/assets/plugins/perfect-scrollbar/css/perfect-scrollbar.css" rel="stylesheet" />
	<link href="/static/assets/plugins/metismenu/css/metisMenu.min.css" rel="stylesheet" />

    <!-- loader-->
	<link href="/static/assets/css/pace.min.css" rel="stylesheet" />
	<script src="/static/assets/js/pace.min.js"></script>

    <!-- Bootstrap CSS -->
	<link href="/static/assets/css/bootstrap.min.css" rel="stylesheet">
	<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
	<link href="/static/assets/css/app.css" rel="stylesheet">
	<link href="/static/assets/css/icons.css" rel="stylesheet">
	<title>京东商品数据分析可视化系统</title>

</head>


<!-- 文档可见内容 -->
<body class="bg-login">

	<!--封装-->
	<div class="wrapper">

        <header class="login-header shadow">
            <nav class="navbar navbar-expand-lg navbar-light bg-white rounded fixed-top rounded-0 shadow-sm">
                <div class="container-fluid">

                    <a class="navbar-brand" href="#">
                        <img src="/static/assets/images/logo-img-daa.png" width="250" alt="" />
                    </a>

                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupporteContent1" aria-expanded="false" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span>
                    </button>

                    <div class="collapse navbar-collapse" id="navbarSupportedContent1">
                        <ul class="navbar-nav ms-auto mb-2 mb-lg-0">

                            <li class="nav-item">
                                <a class="nav-link" href="#"><i class="bx bx-user me-1"></i>网页无障碍</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="#"><i class="bx bx-category-alt me-1"></i>登录页面-改进建议</a>
                            </li>

                        </ul>
                    </div>

                </div>
            </nav>
        </header>

		<div class="section-authentication-signin d-flex align-items-center justify-content-center my-5 my-lg-4">
			<div class="container-fluid">
				<div class="row row-cols-1 row-cols-lg-2 row-cols-xl-3">
					<div class="col mx-auto">
						<div class="card mt-5 mt-lg-0">
                            <div class="card-body">
                                <div class="border p-4 rounded">

                                    <div class="text-center">
                                        <h3 class="">欢迎登录</h3>
                                        <p>没有账户? <a href="{% url 'register' %}">点击这里注册</a>
										</p>
                                    </div>

                                    <div class="form-body">

										<form class="row g-3" method="post">
                                            {% csrf_token %}

											<div class="col-12">
												<label for="username" class="form-label">账号</label>
												<input name="username" class="form-control" id="username" placeholder="输入登录账号">
											</div>

                                            <div class="col-12">
                                                <label for="password" class="form-label">密码</label>
                                                <div class="input-group" id="show_hide_password">
                                                    <input name="password" type="password" class="form-control border-end-0"
                                                           id="password" value="12345678"
                                                           placeholder="输入登录密码">
                                                            <a href="javascript:;" class="input-group-text bg-transparent">
                                                                <i class="bx bx-hide"></i>
                                                            </a>
                                                </div>
                                            </div>

                                            <div class="col-md-6">
                                                <div class="form-check form-switch">
                                                    <input class="form-check-input" type="checkbox"
                                                           id="flexSwitchCheckChecked" checked>
                                                    <label class="form-check-label" for="flexSwitchCheckChecked">记住密码</label>
                                                </div>
                                            </div>

                                            <!--这里authentication-forgot-password.html的行才是源代码-->
{#                                            <div class="col-md-6 text-end">	<a href="authentication-forgot-password.html">忘记密码 ?</a>#}
{#                                            </div>#}
                                            <div class="col-md-6 text-end">	<a href="#">忘记密码 ?</a>
                                            </div>

                                            <div class="col-12">
                                                <div class="d-grid">
                                                    <button type="submit" class="btn btn-primary">
                                                        <i class="bx bxs-lock-open"></i> 立即登录
                                                    </button>
                                                </div>
                                            </div>

{#                                            {% csrf_token %}#}
                                        </form>

							        </div>
						        </div>
					        </div>
				        </div>
                    </div>
                </div>
				<!--end row-->
			</div>
		</div>

        <footer class="bg-white shadow-sm border-top p-2 text-center fixed-bottom">
            <p class="mb-0"> Copyright@2025.All right reserved jd_ksh login</p>
        </footer>
	</div>
	<!--end wrapper-->

	<!-- Bootstrap JS -->
	<script src="/static/assets/js/bootstrap.bundle.min.js"></script>

	<!--plugins-->
	<script src="/static/assets/js/jquery.min.js"></script>
	<script src="/static/assets/plugins/simplebar/js/simplebar.min.js"></script>
	<script src="/static/assets/plugins/metismenu/js/metisMenu.min.js"></script>
	<script src="/static/assets/plugins/perfect-scrollbar/js/perfect-scrollbar.js"></script>

    <!--Password show & hide js -->
	<script>
		$(document).ready(function () {
			$("#show_hide_password a").on('click', function (event) {
				event.preventDefault();
				if ($('#show_hide_password input').attr("type") == "text") {
					$('#show_hide_password input').attr('type', 'password');
					$('#show_hide_password i').addClass("bx-hide");
					$('#show_hide_password i').removeClass("bx-show");
				} else if ($('#show_hide_password input').attr("type") == "password") {
					$('#show_hide_password input').attr('type', 'text');
					$('#show_hide_password i').removeClass("bx-hide");
					$('#show_hide_password i').addClass("bx-show");
				}
			});
		});
    </script>

	<!--app JS-->
	<script src="/static/assets/js/app.js"></script>

</body>


</html>
